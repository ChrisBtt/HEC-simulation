%YAML 1.2
---
topas:
  seed: 1
  physics:
  - g4em-standard_opt0
general:
  simulation_steps: 10
  include_files:
  - config/particle_sources.txt
  - config/scoring_current.txt
  - config/HUtoMaterialSchneider.txt
patient:
  type: 3dct
  dicom_directories:
    - '/Users/pb438/applications/hec-dose-distribution/data/p107/MP1_ph0_masked'
  parameters:
    size_mm: [100., 100., 100.]
    spacing_mm: [1., 1., 1.]
    radiodensity_hu: 0
  scoring_bins: [128, 128, 128]
  translation_mm: [0., 0., 150.]
  rotation_deg: [0., 0., 0.]
  use_center_as_transform_origin: true
tumors:
  - embed_mode: dicom
    topas_material: G4_WATER
    radiodensity_hu: 1000
    translation_mm: [0., 0., 0.]
    rotation_deg: [0., 0., 0.]
    radius_mm: [10., 10., 10.]
    transform_sequence:
      - time_s: 0
        translation_mm: [0., 0., 0.]
        rotation_deg: [0., 0., 0.]
        scale: [1., 1., 1.]
      - time_s: 9
        translation_mm: [10., 10., 0.]
        rotation_deg: [0., 0., 0.]
        scale: [1., 1., 1.]